openapi: 3.1.0
info:
  title: Handball Support API
  version: 1.0.0
  description: |
    REST API for handball table-official performance evaluations and local JWT-based user administration.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Health
  - name: Auth
  - name: Evaluations
paths:
  /:
    get:
      tags: [Health]
      summary: Root greeting endpoint
      responses:
        '200':
          description: Greeting response
          content:
            text/plain:
              schema:
                type: string
  /health:
    get:
      tags: [Health]
      summary: Liveness endpoint
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: UP
  /api/auth/token:
    post:
      tags: [Auth]
      summary: Issue a JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '429':
          $ref: '#/components/responses/ProblemTooManyRequests'
  /api/auth/users:
    get:
      tags: [Auth]
      summary: List authentication users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Auth users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
    post:
      tags: [Auth]
      summary: Create an authentication user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthUserRequest'
      responses:
        '201':
          description: Auth user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '409':
          $ref: '#/components/responses/ProblemConflict'
  /api/auth/users/{username}:
    get:
      tags: [Auth]
      summary: Fetch one authentication user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: Auth user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
    put:
      tags: [Auth]
      summary: Update an authentication user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthUserRequest'
      responses:
        '200':
          description: Updated auth user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '409':
          $ref: '#/components/responses/ProblemConflict'
    delete:
      tags: [Auth]
      summary: Delete an authentication user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '204':
          description: Auth user deleted
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '409':
          $ref: '#/components/responses/ProblemConflict'
  /api/auth/users/{username}/revoke-tokens:
    post:
      tags: [Auth]
      summary: Revoke all active tokens for a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: Tokens revoked and auth user returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
  /api/performance-evaluations:
    get:
      tags: [Evaluations]
      summary: List or filter evaluations
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: query
          required: false
          schema:
            type: string
        - name: firstRefereeId
          in: query
          required: false
          schema:
            type: string
        - name: secondRefereeId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Evaluation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerformanceEvaluationResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
    post:
      tags: [Evaluations]
      summary: Create a new performance evaluation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePerformanceEvaluationRequest'
      responses:
        '201':
          description: Evaluation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceEvaluationResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '409':
          $ref: '#/components/responses/ProblemConflict'
  /api/performance-evaluations/{id}:
    get:
      tags: [Evaluations]
      summary: Fetch an evaluation by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Evaluation found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceEvaluationResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '403':
          $ref: '#/components/responses/ProblemForbidden'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
  /api/nuliga/match-resolutions:
    post:
      tags: [nuLiga]
      summary: Resolve a nuLiga live match URL into teams, rosters and officials
      description: |
        Stateless resolution of a pasted nuLiga (HBDE live) match URL. The server
        reads the meeting from the nuScoreLive REST backend and returns both teams
        with rosters and IHF-lettered officials, the referees and table officials,
        the venue and the kick-off time. Nothing is stored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuLigaMatchResolutionRequest'
      responses:
        '200':
          description: Match resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NuLigaMatchResolutionResponse'
        '400':
          $ref: '#/components/responses/ProblemBadRequest'
        '401':
          $ref: '#/components/responses/ProblemUnauthorized'
        '404':
          $ref: '#/components/responses/ProblemNotFound'
        '502':
          $ref: '#/components/responses/ProblemBadGateway'
        '504':
          $ref: '#/components/responses/ProblemGatewayTimeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UsernamePath:
      name: username
      in: path
      required: true
      schema:
        type: string
  responses:
    ProblemBadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemUnauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemForbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemNotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemBadGateway:
      description: The upstream match source failed or could not be read
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemGatewayTimeout:
      description: The upstream match source did not answer in time
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemConflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProblemTooManyRequests:
      description: Throttled
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    NuLigaMatchResolutionRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: A nuLiga live match URL, e.g. https://hbde-live.liga.nu/nuScoreLive/#/groups/489670/meetings/8278820
    NuLigaMatchResolutionResponse:
      type: object
      required: [sourceId, sourceUrl, sourceMatchId, resolvedAt, match]
      properties:
        sourceId:
          type: string
        sourceUrl:
          type: string
        sourceMatchId:
          type: string
        resolvedAt:
          type: integer
          description: Epoch milliseconds of the resolution
        match:
          $ref: '#/components/schemas/NuLigaMatch'
    NuLigaMatch:
      type: object
      required: [id, status, config, home, away, referees, tableOfficials, supervisors]
      properties:
        id:
          type: string
        scheduledAt:
          type: integer
          description: Kick-off as epoch milliseconds, when nuLiga publishes one
        status:
          $ref: '#/components/schemas/NuLigaStatus'
        config:
          $ref: '#/components/schemas/NuLigaConfig'
        competition:
          $ref: '#/components/schemas/NuLigaCompetition'
        venue:
          $ref: '#/components/schemas/NuLigaVenue'
        home:
          $ref: '#/components/schemas/NuLigaTeam'
        away:
          $ref: '#/components/schemas/NuLigaTeam'
        referees:
          type: array
          items:
            $ref: '#/components/schemas/NuLigaPerson'
        tableOfficials:
          type: array
          items:
            $ref: '#/components/schemas/NuLigaPerson'
        supervisors:
          type: array
          items:
            $ref: '#/components/schemas/NuLigaPerson'
    NuLigaStatus:
      type: object
      required: [id, name, isLive, isFinished]
      properties:
        id:
          type: string
        name:
          type: string
        isLive:
          type: boolean
        isFinished:
          type: boolean
    NuLigaConfig:
      type: object
      required: [periods, minutesPerPeriod]
      properties:
        periods:
          type: integer
        minutesPerPeriod:
          type: integer
    NuLigaCompetition:
      type: object
      required: [name]
      properties:
        name:
          type: string
    NuLigaVenue:
      type: object
      required: [name]
      properties:
        name:
          type: string
    NuLigaTeam:
      type: object
      required: [name, players, officials]
      properties:
        name:
          type: string
        logoUrl:
          type: string
          nullable: true
        players:
          type: array
          items:
            $ref: '#/components/schemas/NuLigaPlayer'
        officials:
          type: array
          items:
            $ref: '#/components/schemas/NuLigaOfficial'
    NuLigaPlayer:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        number:
          type: integer
          nullable: true
    NuLigaOfficial:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        badge:
          type: string
          nullable: true
          description: IHF designation A-E
    NuLigaPerson:
      type: object
      required: [id, firstName, lastName, roleCode, position]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        roleCode:
          type: string
          description: UPPER_SNAKE_CASE role code (REFEREE, TIMEKEEPER, SECRETARY, REFEREE_OBSERVER, SUPERVISOR, TECHNICAL_DELEGATE)
        position:
          type: integer
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    TokenRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, role]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time
        role:
          type: string
          enum: [admin, referee, viewer]
    AuthRole:
      type: string
      enum: [ADMIN, REFEREE, VIEWER]
    CreateAuthUserRequest:
      type: object
      required: [username, password, role, enabled]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        role:
          $ref: '#/components/schemas/AuthRole'
        enabled:
          type: boolean
    UpdateAuthUserRequest:
      type: object
      properties:
        password:
          type: string
          format: password
        role:
          $ref: '#/components/schemas/AuthRole'
        enabled:
          type: boolean
    AuthUserResponse:
      type: object
      required: [username, role, enabled, createdAt, updatedAt]
      properties:
        username:
          type: string
        role:
          $ref: '#/components/schemas/AuthRole'
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tokenInvalidBefore:
          type: string
          format: date-time
          nullable: true
    Person:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
    OfficialRole:
      type: string
      enum: [FIRST_REFEREE, SECOND_REFEREE, TIME_KEEPER, SCORE_KEEPER, DELEGATE]
    EvaluatorType:
      type: string
      enum: [REFEREE_TEAM, DELEGATE]
    RoleAssignment:
      type: object
      required: [person, role]
      properties:
        person:
          $ref: '#/components/schemas/Person'
        role:
          $ref: '#/components/schemas/OfficialRole'
    RefereePair:
      type: object
      required: [firstReferee, secondReferee]
      properties:
        firstReferee:
          $ref: '#/components/schemas/RoleAssignment'
        secondReferee:
          $ref: '#/components/schemas/RoleAssignment'
    TableOfficialTeam:
      type: object
      required: [timeKeeper, scoreKeeper]
      properties:
        timeKeeper:
          $ref: '#/components/schemas/RoleAssignment'
        scoreKeeper:
          $ref: '#/components/schemas/RoleAssignment'
        delegate:
          $ref: '#/components/schemas/RoleAssignment'
    Evaluator:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/EvaluatorType'
        refereePair:
          $ref: '#/components/schemas/RefereePair'
        delegate:
          $ref: '#/components/schemas/RoleAssignment'
      allOf:
        - if:
            properties:
              type:
                const: REFEREE_TEAM
          then:
            required: [refereePair]
        - if:
            properties:
              type:
                const: DELEGATE
          then:
            required: [delegate]
    Game:
      type: object
      required: [gameId, date, homeTeam, awayTeam, venue]
      properties:
        gameId:
          type: string
        date:
          type: string
          format: date
        homeTeam:
          type: string
        awayTeam:
          type: string
        venue:
          type: string
    EvaluationScore:
      type: object
      required: [appearance, influence, teamwork]
      properties:
        appearance:
          type: integer
          minimum: 1
          maximum: 10
        influence:
          type: integer
          minimum: 1
          maximum: 10
        teamwork:
          type: integer
          minimum: 1
          maximum: 10
    CreatePerformanceEvaluationRequest:
      type: object
      required: [game, evaluator, tableOfficialTeam, score]
      properties:
        game:
          $ref: '#/components/schemas/Game'
        evaluator:
          $ref: '#/components/schemas/Evaluator'
        tableOfficialTeam:
          $ref: '#/components/schemas/TableOfficialTeam'
        score:
          $ref: '#/components/schemas/EvaluationScore'
        comment:
          type: string
    PerformanceEvaluationResponse:
      type: object
      required: [id, game, evaluator, tableOfficialTeam, score, weightedTotalScore, createdAt]
      properties:
        id:
          type: string
        game:
          $ref: '#/components/schemas/Game'
        evaluator:
          $ref: '#/components/schemas/Evaluator'
        tableOfficialTeam:
          $ref: '#/components/schemas/TableOfficialTeam'
        score:
          $ref: '#/components/schemas/EvaluationScore'
        comment:
          type: string
          nullable: true
        weightedTotalScore:
          type: integer
        createdAt:
          type: string
          format: date-time
