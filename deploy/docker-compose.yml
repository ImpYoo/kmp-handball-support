services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: handball-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared-credentials.json:/etc/cloudflared/ee176961-282e-463c-8a5b-59a9e0908dd7.json:ro
    networks:
      - handball-net
    depends_on:
      - caddy

  caddy:
    image: caddy:2-alpine
    container_name: handball-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - handball-net

  coaching-web:
    image: handball-coaching-web:local
    container_name: handball-coaching-web
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - handball-net

  handball-backend:
    image: handball-backend:local
    container_name: handball-backend
    restart: unless-stopped
    expose:
      - "8090"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - handball-net

networks:
  handball-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: